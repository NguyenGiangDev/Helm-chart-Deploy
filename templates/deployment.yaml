{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
          env:
            - name: NODE_ENV
              value: {{ $.Values.environment.NODE_ENV | quote }}
            {{- if ne $name "api-gateway" }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            {{- else if eq $name "api-gateway" }}
            - name: ENV_FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: ENV_FRONTEND_URL
            {{- end }}
          {{- if $service.probes }}
          livenessProbe:
            httpGet:
              path: {{ $service.probes.liveness.path }}
              port: {{ $service.probes.liveness.port }}
            initialDelaySeconds: {{ $service.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $service.probes.readiness.path }}
              port: {{ $service.probes.readiness.port }}
            initialDelaySeconds: {{ $service.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $service.probes.readiness.periodSeconds }}
          {{- end }}
{{- end }}