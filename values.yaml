replicaCount: 1

# Chính sách pull image
image:
  pullPolicy: IfNotPresent

# Danh sách service trong microservice app
services:
  api-gateway:
    replicaCount: 2
    port: 3000
    image:
      repository: fintechdevopsacr123ntech-f4aadcc8c4f2daaa.azurecr.io/api-gateway
      tag: v6
    probes:
      liveness:
        path: /health
        port: 3000
        initialDelaySeconds: 10
        periodSeconds: 15
      readiness:
        path: /health
        port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10

